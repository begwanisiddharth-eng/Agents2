find_trending_companies:
  description: >
    Find 2-3 Indian companies in the sector {sector} that are trending in the news 
    as of {current_date}. Search the news using your tools to find these companies.
    Try to always pick new companies, not ones that you have picked before.
  expected_output: >
    A list of 2-3 companies in sector {sector} which are trending in the news as 
    of {current_date}
  agent: trending_company_finder
  output_file: output/trending_companies-{sector}-{current_date}.json

research_trending_companies:
  description: >
    You are provided with a list of a few trending Indian companies in sector {sector}.
    Use your tools to conduct extensive research on each company, including its market
    position, financial health, competitive landscape, strengths and weaknesses, 
    growth potential, and latest news and events. The research should be current as of 
    {current_date}. Do not use your own knowledge, and base your output entirely 
    on the search results.
  expected_output: >
    A comprehensive report on each of companies that are in the list provided to you. The
    report on any one company should not exceed 400 words.
  agent: financial_researcher
  context:
  - find_trending_companies
  output_file: output/research_report-{sector}-{current_date}.json

pick_best_company:
  description: >
    You are provided with research reports on a few Indian companies in the sector
    {sector}. These reports are current as of {current_date}. You need to decide which
    of these companies is most suitable from an investment perspective. Always pick 
    new companies. Do not pick the same company twice.
  expected_output: >
    A report stating which of the companies you selected and why - provide a detailed
    rationale. Also state why the companies that missed out were not selected. Provide
    your report in markdown format not exceeding 400 words. Also, use your tools to send
    a push notification to the user mentioning the selected company and a 1-sentence 
    rationale. 
  agent: stock_picker
  context:
  - research_trending_companies
  output_file: output/Best_Company-{sector}-{current_date}.md